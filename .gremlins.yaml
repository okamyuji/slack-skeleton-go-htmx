# mutation testing(gremlins)の設定です。
# 既定の品質ゲートには含めず、`make mutate`から手動で走らせます。
unleash:
  # 1ミュータントあたりの実行時間は、基準テスト時間のこの倍数までを許容します。
  # 既定値のままだとテーブル駆動テストが軒並みタイムアウト判定になり、
  # 「殺せたのか時間切れなのか」が読めなくなります。
  timeout-coefficient: 6
  # 生き残りが出たら失敗させます。
  threshold-efficacy: 100
  # 変異を仕掛けられた箇所のうち、テストが到達している割合の下限です。
  # crypto/randの失敗経路のように到達させようがない箇所があるため100にはしません。
  threshold-mcover: 80
