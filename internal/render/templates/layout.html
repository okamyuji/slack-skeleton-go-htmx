{{define "layout"}}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{{.Workspace.Name}} | slack-skeleton</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/ws.js" integrity="sha384-QILjBFil9/FrWrP1Y9Qh3vBfd7kiQE8h1BX9auwiVgsFlGwe4tEl7Y966BG178W6" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.13" integrity="sha384-5yQ5JTatiFEgeiEB4mfkRI3oTGtaNpbJGdcciZ4IEYFpLGt8yDsGAd7tKiMwnX9b" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --aubergine: #3f0e40;
      --aubergine-2: #350d36;
      --aubergine-hover: #522653;
      --accent: #1164a3;
      --accent-pale: #e8f1f8;
      --green: #2bac76;
      --bg: #ffffff;
      --bg-soft: #f8f8f8;
      --text: #1d1c1d;
      --text-mute: #616061;
      --border: #e3e3e3;
      --shadow: 0 4px 12px rgba(15, 15, 15, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }
    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
    }
    aside {
      background: var(--aubergine);
      color: #d1d2d3;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .workspace-head {
      padding: 18px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .workspace-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: #b7b8ba;
      font-size: 0.85rem;
    }
    .presence-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 2px var(--aubergine);
    }
    .section-label {
      padding: 16px 20px 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #b7b8ba;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .channel-list { padding-bottom: 8px; }
    .channel {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 20px;
      color: #c1c2c4;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.1s;
    }
    .channel:hover { background: var(--aubergine-hover); }
    .channel.active {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    .channel .hash {
      opacity: 0.7;
      font-weight: 600;
    }
    main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .channel-header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .channel-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      margin: 0;
    }
    .channel-meta {
      color: var(--text-mute);
      font-size: 0.85rem;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 8px;
    }
    .message {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 12px;
      padding: 8px 0;
      border-radius: 6px;
    }
    .message:hover { background: var(--bg-soft); }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4a154b 0%, #611f69 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
    }
    .avatar.user-2 { background: linear-gradient(135deg, #1264a3 0%, #2c81d6 100%); }
    .avatar.user-3 { background: linear-gradient(135deg, #b7791f 0%, #e2a52d 100%); }
    .meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .author { font-weight: 700; color: var(--text); }
    .timestamp { font-size: 0.78rem; color: var(--text-mute); }
    .body {
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .load-history {
      align-self: flex-start;
      margin: 10px 24px 0;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-mute);
      cursor: pointer;
      font: inherit;
      font-size: 0.8rem;
      padding: 4px 10px;
      transition: color 0.15s, border-color 0.15s;
    }
    .load-history:hover { color: var(--accent); border-color: var(--accent); }
    .composer {
      padding: 12px 24px 18px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .composer-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.03);
      transition: border-color 0.15s;
      overflow: hidden;
    }
    .composer-card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .composer textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.45;
      min-height: 70px;
      background: transparent;
      color: var(--text);
    }
    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px 8px 12px;
      font-size: 0.78rem;
      color: var(--text-mute);
    }
    .send-button {
      background: var(--green);
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .send-button:hover { background: #279967; }
    .send-button:disabled { background: #b3d8c3; cursor: not-allowed; }
    .composer-hint kbd {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 4px;
      font-size: 0.75rem;
      font-family: inherit;
    }
    /* GitHub連携管理は折りたたみパネルとしてチャット上部に置く */
    .integration-panel {
      border-bottom: 1px solid var(--border);
      background: var(--bg-soft);
      font-size: 0.9rem;
    }
    .integration-panel summary {
      cursor: pointer;
      padding: 10px 24px;
      color: var(--text-mute);
      font-weight: 600;
      font-size: 0.85rem;
      list-style-position: inside;
    }
    .integration-panel summary:hover { color: var(--accent); }
    .integration-body { padding: 4px 24px 16px; }
    .integration-body p { color: var(--text-mute); margin: 0.35rem 0; }
    .integration-body code {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      padding: 0.1rem 0.3rem;
    }
    .webhook-grid { display: grid; gap: 0.75rem; margin-top: 0.75rem; }
    .webhook-item {
      border-top: 1px solid var(--border);
      display: grid;
      gap: 0.75rem;
      grid-template-columns: minmax(9rem, 1fr) 2fr auto;
      padding-top: 0.75rem;
    }
    .webhook-item span { color: var(--text-mute); display: block; font-size: 0.8rem; margin-top: 0.2rem; }
    .webhook-item dl { display: grid; gap: 0.25rem 0.75rem; grid-template-columns: 7rem minmax(0, 1fr); margin: 0; }
    .webhook-item dt { color: var(--text-mute); font-size: 0.8rem; }
    .webhook-item dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .webhook-form {
      border-top: 1px solid var(--border);
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr 1fr auto;
      margin-top: 1rem;
      padding-top: 1rem;
    }
    .webhook-form h4 { grid-column: 1 / -1; margin: 0; font-size: 0.9rem; }
    .webhook-form label { color: var(--text); display: grid; font-size: 0.8rem; gap: 0.25rem; }
    .webhook-form input, .webhook-form select {
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
      font-size: 0.85rem;
      padding: 0.4rem 0.5rem;
      background: #ffffff;
    }
    .webhook-form button, .webhook-item button {
      align-self: end;
      border: 0;
      border-radius: 6px;
      background: var(--aubergine);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.45rem 0.75rem;
    }
    .webhook-item button { background: #8a1f2d; }
    /* チャンネル切り替え用のセクション表示制御 */
    .channel-section { display: none; height: 100%; flex-direction: column; }
    .channel-section.active { display: flex; }
    /* トースト */
    #toast-area {
      position: fixed;
      right: 24px;
      bottom: 24px;
      display: grid;
      gap: 10px;
      z-index: 50;
      pointer-events: none;
    }
    .toast {
      background: var(--aubergine-2);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      font-size: 0.88rem;
      min-width: 220px;
      max-width: 360px;
      pointer-events: auto;
      cursor: pointer;
      animation: slideUp 0.22s ease-out;
      transition: opacity 0.4s;
    }
    .toast.fade { opacity: 0; }
    .toast strong { display: block; font-weight: 700; margin-bottom: 2px; font-size: 0.78rem; color: #c0a6d6; text-transform: uppercase; letter-spacing: 0.04em; }
    @keyframes slideUp {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
{{template "body" .}}
<div id="toast-area"></div>
<script>
  // サイドバーのチャンネル切り替えです。表示制御だけなのでJSのクラス切り替えで済ませます。
  function showChannel(id) {
    document.querySelectorAll('.channel-section').forEach(el => el.classList.toggle('active', el.id === 'channel-' + id));
    document.querySelectorAll('.channel').forEach(el => el.classList.toggle('active', el.dataset.id === String(id)));
  }
  document.addEventListener('DOMContentLoaded', () => {
    const first = document.querySelector('.channel');
    if (first) showChannel(first.dataset.id);
  });
</script>
</body>
</html>{{end}}
